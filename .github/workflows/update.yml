name: Update Market Weather

on:
  schedule:
    - cron: '*/17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skript ausführen
        run: python engine.py

      - name: Änderungen speichern und pushen
        run: |
          git config --global user.name "MarketWeatherBot"
          git config --global user.email "bot@marktwetter.org"
          # WICHTIG: history.csv hier mit aufnehmen:
          git add index.html weather.json weather.txt badge.svg history.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto-Update: Market weather updated"
            git pull --rebase origin main
            git push
          fi
