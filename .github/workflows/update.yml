name: Update Market Weather

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skript ausführen
        run: python engine.py

      - name: Änderungen speichern und pushen
        run: |
          git config --global user.name "MarketWeatherBot"
          git config --global user.email "bot@marktwetter.org"
          git add index.html weather.json weather.txt badge.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: Market weather updated" && git push)
